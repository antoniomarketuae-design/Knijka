# Please do not edit this file manually
# It should be added in your repository (i.e. .git) and NOT in .gitignore

# This file had never been committed. Prisma writes it the first time it
# generates a migration; every migration here was hand-written instead, so it
# was never created — and without it the CLI cannot tell which connector the
# migrations directory targets. `prisma migrate diff --from-migrations` fails
# outright with "Could not determine the connector from the migrations
# directory", which means the migration set could not be diffed against
# schema.prisma or replayed onto an empty database by anyone who tried.
#
# That is the tooling half of audit finding 26: `prisma generate` builds the
# client from schema.prisma ALONE, so the app typechecks against columns no
# migration creates, and the one command that would have caught the drift was
# broken. The local dev database is the proof — it has no _prisma_migrations
# table at all (it was created with `db push`) and is missing five tables that
# migrations do create.
provider = "postgresql"
