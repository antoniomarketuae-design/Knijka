<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Feel Spike — Rapier Raycast Car</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e12;
        font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .hud {
        position: fixed;
        top: 14px;
        left: 14px;
        min-width: 190px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.72);
        color: #e8eef5;
        font-size: 14px;
        line-height: 1.55;
        letter-spacing: 0.02em;
        user-select: none;
        pointer-events: none;
        z-index: 10;
      }
      .hud .speed {
        font-size: 30px;
        font-weight: 700;
        color: #7fd4ff;
      }
      .hud .speed small {
        font-size: 13px;
        font-weight: 400;
        color: #9db2c7;
      }
      .hud .hb {
        color: #ff7b72;
        font-weight: 700;
        visibility: hidden;
      }
      .hud .hb.on {
        visibility: visible;
      }
      .help {
        position: fixed;
        bottom: 14px;
        left: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.6);
        color: #9db2c7;
        font-size: 12px;
        line-height: 1.6;
        user-select: none;
        pointer-events: none;
        z-index: 10;
      }
      .fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 5, 5, 0.92);
        color: #ffb3ad;
        font-size: 15px;
        padding: 40px;
        white-space: pre-wrap;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
