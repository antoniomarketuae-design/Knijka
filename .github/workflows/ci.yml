# The gate, mechanized (doc 61): every PR and every push to an integration
# branch runs the same checks each developer runs locally. Nobody merges red.
# Dummy env values — no test connects to a real database; prisma only needs the
# vars to exist to generate/config-load.
#
# WHY THIS FILE GREW (audit 2026-07-24, findings H-12 + H-17): the gate used to
# be decorative. It ran, it went red, and nothing downstream cared — staging
# deployed from branch HEAD on a 5-minute timer that never consulted a check
# run, so a red commit shipped to students anyway. Two changes fix that:
#
#  1. `cancel-in-progress` is now PR-only. On an integration branch every
#     commit must reach a terminal verdict, because the deploy pointer below is
#     derived from it — a cancelled run leaves a commit with no verdict at all,
#     which is indistinguishable from "not green yet", forever.
#  2. The `deployable` job moves the `staging-green` tag to the commit ONLY
#     after every gate step passed. The VPS deploys THAT TAG instead of branch
#     HEAD, so a red commit is structurally undeployable and the last green
#     commit stays live. Rolling back is `git tag -f staging-green <older sha>`
#     — plain git, which the deploy script already speaks, and no API token has
#     to live on the box.
#
# Branch discipline (H-12b) cannot be enforced from a workflow file: require
# `gate` as a status check and forbid direct pushes in the branch-protection
# settings for `scenario-engine`/`main`. Until that is switched on, the deploy
# pointer is what actually protects students.
#
# WHAT CHANGED AFTER THAT (the database gate): the env values below were a
# fiction — `postgresql://ci:ci@localhost:5432/ci` with no postgres anywhere in
# this file — and the only Prisma step was `generate`, which reads
# schema.prisma and never looks at prisma/migrations. A schema change with no
# migration therefore passed every single check here and only failed in
# production, on students. There is now a real postgres:17 service, migrations
# are APPLIED to it, and the applied database is diffed against schema.prisma.
# See the `services:` block for the full failure mode it closes.
name: gate

on:
  pull_request:
  push:
    branches: [main, scenario-engine]
  # Merge queues run the gate on the merged result, not on the PR head.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR run is free — superseding an integration-branch run
  # destroys the verdict the deploy pointer depends on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SHADOW_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_shadow"
      AUTH_SECRET: "ci-dummy-secret"
    # THE DATABASE STEPS BELOW ARE WHY THIS SERVICE EXISTS, and it is worth
    # being exact about the hole they close. The URLs above used to point at
    # nothing — there was no postgres here — and the only Prisma step was
    # `generate`, which reads schema.prisma and never once looks at
    # prisma/migrations. So: add a column to the schema, write code against it,
    # forget the migration. Typecheck passes (the generated client has the
    # column). Tests pass (they inject in-memory stores). The build passes.
    # CI is green. The deploy's health gate says 200 because /api/health ran
    # `SELECT 1` and the database answered. And every request that touches the
    # column 500s, for students, until someone notices.
    #
    # ~40 seconds of container start and two Prisma commands ends that shape.
    # postgres:17 matches the VPS; `pg_isready` gating means the migrate step
    # never races a database that has not finished booting.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Action majors are pinned to v6, not the newest v7. v6 is where both
      # actions moved off the deprecated node20 runtime (node24 since v5.0.0),
      # which is the whole point of this pin; v7 (checkout 2026-06-18,
      # setup-node 2026-07-14) is a fresh ESM rewrite of both and has barely
      # soaked. `node-version: 22` below is the APP's node and is unrelated.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      # ---- the schema gate, before the slow steps ---------------------------
      # First, because a migration that does not apply is a fact you want in
      # forty seconds, not after a five-minute build.

      # Refuse a migration that would break the build currently running.
      # `--all` rather than a diff against a base ref: it needs no git history,
      # it cannot be fooled by a shallow checkout, and it is stable — a drop
      # that legitimately merges carries its `knijka:allow-destructive` marker
      # forever, so a green run stays green. The reasoning (expand/contract,
      # and why the deploy's rollback depends on it) is in the script header
      # and in tools/deploy/README.md.
      - name: migrations are rollback-safe
        run: node ../tools/deploy/check-migrations.mjs --all

      # Apply every migration to a REAL postgres. This is the step whose
      # absence made "forgot the migration" invisible: it fails on bad SQL, on
      # a migration that conflicts with an earlier one, and on anything that
      # cannot actually be applied in order from empty.
      - name: apply migrations
        run: npx prisma migrate deploy

      # …and then ask whether the database we just built matches the schema the
      # code was generated from. THIS is the check that catches the forgotten
      # migration: schema.prisma has the column, prisma/migrations does not, so
      # the diff is non-empty and `--exit-code` returns 2.
      #
      # Printed human-readably first so a failure explains itself in the log
      # instead of being a bare non-zero exit at 3am.
      #
      # WHEN THIS FAILS, READ THE PRINTED DIFF BEFORE ASSUMING IT IS WRONG. The
      # normal cause is the one it exists for: a schema change with no
      # migration. The one KNOWN false-positive candidate is the hand-written
      # PARTIAL unique index on Entitlement(provider, providerRef) — Prisma's
      # PSL cannot express a WHERE clause, so the index is created under the
      # exact name Prisma derives from the @@unique and the differ matches it
      # by name and columns. If a future Prisma release starts describing index
      # predicates, that index is what will show up here, and the fix is to
      # teach the schema about it — never to delete this step.
      - name: schema matches the migrations (no drift)
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: typecheck
        run: npx tsc --noEmit
      - name: tests
        run: npx vitest run
      # The repo's OTHER runner. tools/theory and tools/deploy are tested with
      # node:test, which `npx vitest run` cannot see, so until this step existed
      # 92 tests — the content-authoring guards and the whole H-17 deploy-order
      # battery — ran only when a developer typed the per-file command in their
      # header. scripts/tools-tests.mjs discovers them by which runner they
      # import, so a new tools/ test is covered without touching this file.
      - name: tools tests
        run: npm run test:tools
      - name: sim harness
        run: node scripts/sim-harness.mjs
      # The content contract (content/SCHEMA.md): every lawRef resolves, every
      # media reference exists, every topic is covered. Cheap — and it is the
      # only check that reads content/, which the app trusts blindly at boot.
      - name: content contract
        run: node scripts/validate-content.mjs
      - name: build
        run: npm run build

  # The deploy pointer. Runs only on the integration branches, only after the
  # gate is green, and does nothing on a PR — so the tag can never name a
  # commit that has not passed every check above.
  #
  # VPS side (founder action, doc 61): the box currently deploys from the `vps`
  # bare remote, which never sees this tag. Add GitHub as a fetch remote there
  # and make /opt/knijka/autodeploy.sh resolve `staging-green` instead of
  # branch HEAD, refusing to deploy when the tag has not moved. Without that
  # one-line change on the box this job is inert — it records the verdict but
  # nothing consumes it.
  deployable:
    needs: gate
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'scenario-engine')
    runs-on: ubuntu-latest
    permissions:
      contents: write # moving the tag is the only write this repo's CI does
    steps:
      # checkout v6 stores the pushed-back credential in a file under
      # $RUNNER_TEMP instead of .git/config, so the `git push` below still
      # authenticates with no change here (the known exceptions — Docker
      # container actions, worktrees, self-hosted symlinked _work — are all
      # things this job does not do).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: move staging-green to this commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-move: the tag is a POINTER to the newest green commit, not a
          # release marker. Log the previous target so the rollback SHA is one
          # `git log` away when a deploy has to be undone in a hurry.
          echo "previous staging-green: $(git rev-list -n 1 staging-green 2>/dev/null || echo none)"
          git tag -f staging-green "$GITHUB_SHA"
          git push -f origin refs/tags/staging-green
